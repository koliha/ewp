[project]
name = "ewp"
version = "0.1.0"
description = "Epistemic Warrant Protocol — deterministic boundary between agent memory and justified acceptance"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Rob Koliha" }]
keywords = ["epistemic", "warrant", "agent-memory", "ai-agents"]

[project.urls]
Repository = "https://github.com/koliha/ewp"

[tool.setuptools.packages.find]
include = ["protocol*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
