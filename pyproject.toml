[project]
name = "ewp"
version = "0.2.0"
description = "Epistemic Warrant Protocol — deterministic boundary between agent memory and justified acceptance"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Rob Koliha" }]
keywords = ["epistemic", "warrant", "agent-memory", "ai-agents"]

[project.urls]
Repository = "https://github.com/koliha/ewp"

[project.scripts]
ewp-mcp = "ewp.mcp_server:main"
ewp-ingest = "ewp.ingest_cli:main"

[tool.setuptools.packages.find]
include = ["ewp*"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
