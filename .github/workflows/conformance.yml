name: conformance

on:
  push:
  pull_request:

jobs:
  conformance:
    name: frozen suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP SDK and mem0ai (client interop tests)
        run: python3 -m pip install mcp "mem0ai==2.2.0"
      - name: Run frozen CI
        run: python3 tests/ci.py
      - name: Print conformance claim
        run: python3 tests/report.py
      - name: Tester path (pip install, ewp-ingest, ewp-mcp)
        run: |
          python3 -m venv /tmp/ewp-venv
          /tmp/ewp-venv/bin/pip install --quiet .
          /tmp/ewp-venv/bin/ewp-ingest --db /tmp/ewp.sqlite examples/quickstart.json --attest-trusted-origins
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"ewp_list_propositions","arguments":{}}}' \
            | /tmp/ewp-venv/bin/ewp-mcp --db /tmp/ewp.sqlite | tee /tmp/mcp.out
          grep -q P-prod-db-version /tmp/mcp.out
